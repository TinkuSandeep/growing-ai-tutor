<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Growing AI Tutor</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <h1>🌱 Growing AI Tutor</h1>
      <p>Learn • Think • Practice • Grow</p>
    </header>

    <section id="loginCard" class="card narrow">
      <h2>Family Login</h2>
      <input id="password" type="password" placeholder="App password" />
      <button onclick="login()">Enter</button>
      <p id="loginMsg" class="msg"></p>
    </section>

    <section id="app" class="hidden">
      <nav class="tabs">
        <button onclick="showTab('learn')">🎓 Learn</button>
        <button onclick="showTab('abacus')">🧮 Abacus</button>
        <button onclick="showTab('parent')">📊 Parent</button>
      </nav>

      <div class="card">
        <div class="row">
          <select id="studentSelect"></select>
          <input id="newStudent" placeholder="New student name" />
          <input id="grade" type="number" value="2" min="1" max="12" />
          <button onclick="addStudent()">Add Student</button>
        </div>
      </div>

      <section id="learn" class="tab card">
        <h2>Learning Studio</h2>
        <div class="row">
          <select id="subject" onchange="refreshTopics()"></select>
          <select id="topic"></select>
          <button onclick="teach()">Teach Me</button>
          <button onclick="nextQuestion()">New Question</button>
        </div>
        <div id="teacher" class="teacher"></div>
        <div id="quizBox" class="quiz hidden">
          <h3 id="question"></h3>
          <input id="answer" placeholder="Your answer" onkeydown="if(event.key==='Enter') submitAnswer()" />
          <button onclick="submitAnswer()">Check</button>
          <p id="feedback" class="msg"></p>
        </div>
        <div id="recommendation" class="recommendation"></div>
      </section>

      <section id="abacus" class="tab card hidden">
        <h2>🧮 Abacus Lab</h2>
        <div class="row">
          <input id="abacusNumber" type="number" min="0" max="9999" value="27" />
          <button onclick="buildAbacus()">Show Number</button>
        </div>
        <div id="abacusBoard" class="abacus"></div>
        <ol id="abacusSteps"></ol>
      </section>

      <section id="parent" class="tab card hidden">
        <h2>📊 Parent Dashboard</h2>
        <div id="summary"></div>
        <table>
          <thead><tr><th>Subject</th><th>Topic</th><th>Attempts</th><th>Mastery</th><th>Level</th></tr></thead>
          <tbody id="progressRows"></tbody>
        </table>
      </section>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
